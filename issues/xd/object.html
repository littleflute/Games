<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画布绘图与爆炸效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        /* 顶部工具条样式 */
        .toolbar {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .toolbar button:hover {
            background-color: #2980b9;
        }
        
        .toolbar button.active {
            background-color: #27ae60;
        }
        
        /* 中间画布容器 */
        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #ecf0f1;
            overflow: hidden;
        }
        
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        /* 底部状态栏样式 */
        .status-bar {
            background-color: #34495e;
            color: white;
            padding: 8px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部工具条 -->
    <div class="toolbar">
        <button id="drawBrickBtn">绘制砖块</button>
        <button id="placeBombBtn">放置炸弹</button>
        <button id="lightFuseBtn">点燃导火索</button>
    </div>
    
    <!-- 中间画布区域 -->
    <div class="canvas-container">
        <canvas id="drawCanvas"></canvas>
    </div>
    
    <!-- 底部状态栏 -->
    <div class="status-bar" id="statusBar">
        状态：就绪 | 操作提示：点击按钮选择功能，然后在画布上点击/拖动
    </div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        const drawBrickBtn = document.getElementById('drawBrickBtn');
        const placeBombBtn = document.getElementById('placeBombBtn');
        const lightFuseBtn = document.getElementById('lightFuseBtn');
        const statusBar = document.getElementById('statusBar');
        
        // 全局状态变量
        let currentMode = null; // 当前模式：'brick' 或 'bomb' 或 'light'
        let bricks = []; // 存储所有砖块对象
        let bombs = []; // 存储所有炸弹对象
        let isDragging = false;
        let startX, startY;
        
        // 砖块类
        class Brick {
            constructor(x, y, width = 80, height = 40, color = null) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color || this.getRandomColor();
                this.isDestroyed = false;
            }
            
            // 获取随机颜色
            getRandomColor() {
                return `hsl(${Math.random() * 360}, 70%, 50%)`;
            }
            
            // 绘制砖块
            draw() {
                if (this.isDestroyed) return;
                
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // 绘制砖块边框
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                // 绘制砖块纹理
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.lineWidth = 1;
                for (let i = 1; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(this.x + i * this.width / 3, this.y);
                    ctx.lineTo(this.x + i * this.width / 3, this.y + this.height);
                    ctx.stroke();
                }
                for (let i = 1; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + i * this.height / 3);
                    ctx.lineTo(this.x + this.width, this.y + i * this.height / 3);
                    ctx.stroke();
                }
            }
            
            // 判断点是否在砖块内
            contains(x, y) {
                return !this.isDestroyed && 
                       x >= this.x && x <= this.x + this.width &&
                       y >= this.y && y <= this.y + this.height;
            }
            
            // 检查是否在爆炸范围内
            checkExplosion(explosionX, explosionY, explosionRadius) {
                if (this.isDestroyed) return false;
                
                // 计算砖块中心到爆炸中心的距离
                const brickCenterX = this.x + this.width / 2;
                const brickCenterY = this.y + this.height / 2;
                const distance = Math.sqrt(
                    Math.pow(brickCenterX - explosionX, 2) + 
                    Math.pow(brickCenterY - explosionY, 2)
                );
                
                // 如果距离小于爆炸半径，砖块被摧毁
                if (distance < explosionRadius) {
                    this.isDestroyed = true;
                    return true;
                }
                return false;
            }
        }
        
        // 炸弹类
        class Bomb {
            constructor(x, y, radius = 40) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.isLit = false; // 导火索是否被点燃
                this.isExploding = false; // 是否正在爆炸
                this.fuseLength = 60; // 导火索长度
                this.fuseProgress = 0; // 导火索燃烧进度 (0-1)
                this.fuseBurning = false; // 导火索是否在燃烧
                this.particles = []; // 爆炸粒子
                this.fuseLine = { // 导火索线段
                    x1: x + radius * 0.7,
                    y1: y - radius * 0.5,
                    x2: x + radius * 1.2,
                    y2: y - radius * 0.8
                };
                this.fuseTip = { // 导火索末端（点火点）
                    x: this.fuseLine.x2,
                    y: this.fuseLine.y2,
                    radius: 8
                };
            }
            
            // 绘制炸弹
            draw() {
                if (this.isExploding) {
                    this.drawExplosion();
                    return;
                }
                
                // 绘制炸弹主体
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制炸弹高光
                ctx.fillStyle = '#34495e';
                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.8, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制炸弹引信孔
                ctx.fillStyle = '#7f8c8d';
                ctx.beginPath();
                ctx.arc(this.x + this.radius * 0.5, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制导火索
                this.drawFuse();
                
                // 绘制导火索末端点火点
                this.drawFuseTip();
            }
            
            // 绘制导火索
            drawFuse() {
                // 导火索线段
                ctx.strokeStyle = this.fuseBurning ? '#ff6b00' : '#95a5a6';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.fuseLine.x1, this.fuseLine.y1);
                
                // 如果导火索在燃烧，绘制燃烧进度
                if (this.fuseBurning && this.fuseProgress < 1) {
                    const currentX = this.fuseLine.x1 + (this.fuseLine.x2 - this.fuseLine.x1) * this.fuseProgress;
                    const currentY = this.fuseLine.y1 + (this.fuseLine.y2 - this.fuseLine.y1) * this.fuseProgress;
                    ctx.lineTo(currentX, currentY);
                } else {
                    ctx.lineTo(this.fuseLine.x2, this.fuseLine.y2);
                }
                ctx.stroke();
                
                // 如果导火索在燃烧，绘制火焰
                if (this.fuseBurning && this.fuseProgress < 1) {
                    const flameX = this.fuseLine.x1 + (this.fuseLine.x2 - this.fuseLine.x1) * this.fuseProgress;
                    const flameY = this.fuseLine.y1 + (this.fuseLine.y2 - this.fuseLine.y1) * this.fuseProgress;
                    
                    // 绘制火焰
                    const gradient = ctx.createRadialGradient(
                        flameX, flameY, 0,
                        flameX, flameY, 15
                    );
                    gradient.addColorStop(0, '#ffff00');
                    gradient.addColorStop(0.5, '#ff8800');
                    gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(flameX, flameY, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 绘制导火索末端点火点
            drawFuseTip() {
                if (this.fuseBurning || this.isExploding) return;
                
                // 绘制可点击的导火索末端
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(this.fuseTip.x, this.fuseTip.y, this.fuseTip.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 添加发光效果
                ctx.shadowColor = '#e74c3c';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#ff8c00';
                ctx.beginPath();
                ctx.arc(this.fuseTip.x, this.fuseTip.y, this.fuseTip.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // 绘制"点击"文字提示
                ctx.fillStyle = 'white';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('点击', this.fuseTip.x, this.fuseTip.y + 4);
            }
            
            // 检查是否点击了导火索末端
            isFuseTipClicked(x, y) {
                if (this.fuseBurning || this.isExploding) return false;
                
                const distance = Math.sqrt(
                    Math.pow(x - this.fuseTip.x, 2) + 
                    Math.pow(y - this.fuseTip.y, 2)
                );
                return distance <= this.fuseTip.radius;
            }
            
            // 点燃导火索
            lightFuse() {
                if (this.fuseBurning || this.isExploding) return;
                
                this.fuseBurning = true;
                this.fuseProgress = 0;
                this.animateFuse();
                updateStatus(`导火索已点燃！炸弹将在3秒后爆炸`);
            }
            
            // 导火索燃烧动画
            animateFuse() {
                if (!this.fuseBurning || this.fuseProgress >= 1) {
                    if (this.fuseProgress >= 1) {
                        this.explode();
                    }
                    return;
                }
                
                // 更新燃烧进度
                this.fuseProgress += 0.005;
                
                // 继续动画
                setTimeout(() => {
                    this.animateFuse();
                }, 16); // 约60fps
            }
            
            // 爆炸
            explode() {
                this.isExploding = true;
                this.fuseBurning = false;
                this.createParticles();
                this.animateExplosion();
                
                // 爆炸影响范围内的砖块
                const explosionRadius = 120;
                bricks.forEach(brick => {
                    brick.checkExplosion(this.x, this.y, explosionRadius);
                });
            }
            
            // 创建爆炸粒子
            createParticles() {
                const particleCount = 80;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    const radius = Math.random() * 10 + 2;
                    
                    this.particles.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: radius,
                        color: `hsl(${Math.random() * 30 + 20}, 100%, 50%)`, // 橙红色系
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.01,
                        shrink: 0.95 + Math.random() * 0.03
                    });
                }
            }
            
            // 绘制爆炸效果
            drawExplosion() {
                // 绘制爆炸粒子
                this.particles.forEach((particle, index) => {
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = particle.alpha;
                    ctx.fill();
                    
                    // 更新粒子位置和属性
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.alpha -= particle.decay;
                    particle.radius *= particle.shrink;
                    
                    // 移除消失的粒子
                    if (particle.alpha <= 0 || particle.radius <= 0.5) {
                        this.particles.splice(index, 1);
                    }
                });
                
                ctx.globalAlpha = 1;
                
                // 如果所有粒子都消失了，爆炸结束
                if (this.particles.length === 0) {
                    this.isExploding = false;
                    // 从炸弹数组中移除这个炸弹
                    const index = bombs.indexOf(this);
                    if (index > -1) {
                        bombs.splice(index, 1);
                    }
                }
            }
        }
        
        // 初始化画布尺寸
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            redrawAll();
        }
        
        // 重新绘制所有元素
        function redrawAll() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制所有砖块
            bricks.forEach(brick => brick.draw());
            
            // 绘制所有炸弹
            bombs.forEach(bomb => bomb.draw());
        }
        
        // 动画循环
        function animate() {
            redrawAll();
            requestAnimationFrame(animate);
        }
        
        // 更新状态栏信息
        function updateStatus(message) {
            statusBar.textContent = `状态：${message} | 操作提示：点击按钮选择功能，然后在画布上点击/拖动`;
        }
        
        // 按钮点击事件
        drawBrickBtn.addEventListener('click', () => {
            currentMode = 'brick';
            drawBrickBtn.classList.add('active');
            placeBombBtn.classList.remove('active');
            lightFuseBtn.classList.remove('active');
            updateStatus('绘制砖块模式 - 点击画布绘制砖块，或拖动绘制自定义尺寸砖块');
            canvas.style.cursor = 'crosshair';
        });
        
        placeBombBtn.addEventListener('click', () => {
            currentMode = 'bomb';
            placeBombBtn.classList.add('active');
            drawBrickBtn.classList.remove('active');
            lightFuseBtn.classList.remove('active');
            updateStatus('放置炸弹模式 - 点击画布放置炸弹，然后切换到点燃模式点燃导火索');
            canvas.style.cursor = 'crosshair';
        });
        
        lightFuseBtn.addEventListener('click', () => {
            currentMode = 'light';
            lightFuseBtn.classList.add('active');
            drawBrickBtn.classList.remove('active');
            placeBombBtn.classList.remove('active');
            updateStatus('点燃导火索模式 - 点击炸弹的导火索末端（红色圆点）点燃炸弹');
            canvas.style.cursor = 'pointer';
        });
        
        // 画布鼠标事件
        canvas.addEventListener('mousedown', (e) => {
            if (!currentMode) return;
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 在点燃模式下，检查是否点击了炸弹导火索
            if (currentMode === 'light') {
                let fuseLit = false;
                bombs.forEach(bomb => {
                    if (bomb.isFuseTipClicked(mouseX, mouseY)) {
                        bomb.lightFuse();
                        fuseLit = true;
                    }
                });
                
                if (fuseLit) {
                    return;
                } else {
                    updateStatus('未找到可点燃的导火索，请点击炸弹的红色导火索末端');
                }
            }
            
            // 在放置炸弹模式下，放置炸弹
            if (currentMode === 'bomb') {
                const newBomb = new Bomb(mouseX, mouseY);
                bombs.push(newBomb);
                updateStatus(`已放置炸弹 - 位置：(${Math.round(mouseX)}, ${Math.round(mouseY)})`);
                return;
            }
            
            // 在绘制砖块模式下，开始拖动
            if (currentMode === 'brick') {
                isDragging = true;
                startX = mouseX;
                startY = mouseY;
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || currentMode !== 'brick') return;
            
            // 实时绘制拖动的砖块（临时）
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            
            // 清除画布并重新绘制已有元素 + 临时砖块
            redrawAll();
            
            const width = currentX - startX;
            const height = currentY - startY;
            const x = width >= 0 ? startX : startX + width;
            const y = height >= 0 ? startY : startY + height;
            
            // 绘制临时砖块
            ctx.fillStyle = 'rgba(231, 76, 60, 0.5)';
            ctx.fillRect(x, y, Math.abs(width), Math.abs(height));
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, Math.abs(width), Math.abs(height));
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (!isDragging || currentMode !== 'brick') {
                isDragging = false;
                return;
            }
            
            isDragging = false;
            
            // 获取最终坐标
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;
            
            // 计算砖块尺寸
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);
            const x = Math.min(startX, endX);
            const y = Math.min(startY, endY);
            
            // 如果尺寸太小，视为点击绘制默认尺寸砖块
            const brickWidth = width < 10 ? 80 : width;
            const brickHeight = height < 10 ? 40 : height;
            const brickX = width < 10 ? startX - 40 : x;
            const brickY = height < 10 ? startY - 20 : y;
            
            // 创建砖块对象
            const newBrick = new Brick(brickX, brickY, brickWidth, brickHeight);
            bricks.push(newBrick);
            
            updateStatus(`已绘制砖块 - 位置：(${Math.round(brickX)}, ${Math.round(brickY)}) 尺寸：${Math.round(brickWidth)}x${Math.round(brickHeight)}`);
        });
        
        // 窗口大小变化时调整画布尺寸
        window.addEventListener('resize', resizeCanvas);
        
        // 初始化
        resizeCanvas();
        animate();
    </script>
</body>
</html>
<!--
升级程序
添加版本号
炸弹可以把砖块炸的粉碎并消失。
但是砖块要被炸三次才会彻底消失，
第一次会裂
第二次会裂的厉害一点，
第三次会彻底粉碎
添加三个按钮可以设置初始场景。初始场景里面有一些砖块，有一些炸弹。用户点导火索的时候，最终能看到场景里的砖块都会被炸飞。

-->
